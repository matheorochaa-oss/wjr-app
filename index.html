<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>WJR Locações</title>
<meta name="description" content="Estoque, locações, agenda e financeiro da WJR.">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1c2025" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icones/icone-192.png">
<link rel="apple-touch-icon" href="icones/icone-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="WJR">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&display=swap">
<style>
/* Layout: faixa branca com a logo e o "colar" amarelo da escora, abas fixas, conteúdo em cartões; detalhes sobem como folha no celular */
:root{
  --bg:#eef0f2; --surface:#ffffff; --surface2:#f5f6f8; --ink:#1a1e23; --muted:#5a636d; --line:#d5dae0;
  --accent:#f5a800; --accent-ink:#1a1e23; --accent-soft:#fdf0c9;
  --ok:#1d9a51; --warn:#d69600; --bad:#d13e30; --info:#2d6db3;
  --ok-soft:#e0f3e7; --bad-soft:#fae4e1; --info-soft:#e2ecf8; --warn-soft:#fbf0d2;
  --shadow:0 1px 2px rgba(20,30,40,.06),0 4px 14px rgba(20,30,40,.06);
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:10px; color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#14171b; --surface:#1c2025; --surface2:#23282e; --ink:#e8ebee; --muted:#9aa3ad; --line:#333a42;
  --accent:#f7b521; --accent-ink:#15181c; --accent-soft:#3a3217;
  --ok:#3ecf7e; --warn:#f0c02e; --bad:#ff6a5c; --info:#6aa6ec;
  --ok-soft:#173323; --bad-soft:#3d1f1c; --info-soft:#1b2a3e; --warn-soft:#3a3118;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark;
}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.4;-webkit-font-smoothing:antialiased;padding-bottom:env(safe-area-inset-bottom,0px)}
body.noscroll{overflow:hidden}
img{max-width:100%}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--info)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.tnum{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}

/* topo: nas cores do app, logo sem fundo (preta no claro, clara no escuro) */
.top{background:var(--surface);color:var(--ink);padding-top:env(safe-area-inset-top,0px)}
.topin{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px 6px}
.logo{height:40px;width:auto;display:block}
@media (max-width:520px){.logo{height:32px}}
.topacts{display:flex;gap:8px;align-items:center}
.tabs{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.tabsin{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.tabsin::-webkit-scrollbar{display:none}
.tab{border:0;background:none;padding:14px 12px 12px;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap}
.tab[aria-current="page"]{color:var(--ink);border-bottom-color:var(--accent)}
.tab .n{font-size:12px;background:var(--surface2);border-radius:20px;padding:1px 7px;margin-left:4px;color:var(--muted)}
.tab .sync{display:inline-block;width:8px;height:8px;border-radius:50%;margin-left:6px;vertical-align:middle}
.tab .ico,.tab .ts{display:none}
.ico{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
main{padding-block:20px 60px;display:flex;flex-direction:column;gap:18px}
/* celular: abas viram barra fixa embaixo, com ícone e nome */
@media (max-width:640px){
  .tabs{position:fixed;top:auto;bottom:0;left:0;right:0;z-index:15;border-bottom:0;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
  .tabsin{padding-left:max(2px,env(safe-area-inset-left,0px));padding-right:max(2px,env(safe-area-inset-right,0px));gap:0;overflow:visible}
  .tab{flex:1 1 0;min-width:0;padding:9px 0 8px;font-size:13px;border-bottom:0;border-top:3px solid transparent;margin-top:-1px;display:flex;flex-direction:column;align-items:center;gap:3px;position:relative}
  .tab .ico{display:block}
  .tab .tl{display:none}
  .tab .ts{display:block;white-space:nowrap}
  .tab[aria-current="page"]{border-top-color:var(--accent);color:var(--ink)}
  .tab[aria-current="page"] .ico{color:var(--accent)}
  .tab .n{display:none}
  .tab .sync{position:absolute;top:8px;left:calc(50% + 12px);width:8px;height:8px;margin:0}
  main{padding-bottom:calc(110px + env(safe-area-inset-bottom,0px))}
  #toast{bottom:calc(92px + env(safe-area-inset-bottom,0px))}
  .top .btn.primary{padding:8px 12px;font-size:15px}
}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 14px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.dark{background:#1a1e23;color:#fff;border-color:#1a1e23}
.btn.danger{color:var(--bad)}
.btn.armed{background:var(--bad);color:#fff;border-color:var(--bad)}
.btn.small{padding:6px 10px;font-size:14px}
.btn:disabled{opacity:.5;cursor:default}

h1,h2,h3{font-family:var(--f-display);font-weight:700;letter-spacing:.01em;margin:0;text-wrap:balance}
h2{font-size:26px} h3{font-size:20px}
.secthead{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.label{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
p{margin:0}

.aviso{border-radius:var(--r);padding:12px 14px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-top:16px;background:var(--warn-soft);border:1px solid var(--warn)}
.aviso.bad{background:var(--bad-soft);border-color:var(--bad)}
.aviso.info{background:var(--info-soft);border-color:var(--info)}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.stat{min-width:0}
.stat .v{font-family:var(--f-display);font-size:clamp(22px,6.4vw,30px);overflow-wrap:anywhere;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.stat.bad .v{color:var(--bad)} .stat.ok .v{color:var(--ok)} .stat.warn .v{color:var(--warn)}

.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:20px;padding:6px 12px;font-size:14px;font-weight:600;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.search{flex:1 1 220px;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 12px}

.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:10px}
@media (max-width:400px){.list{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;text-align:left;display:flex;flex-direction:column;gap:6px;min-width:0;box-shadow:var(--shadow)}
button.card:hover{border-color:var(--muted)}
.card > span{display:block;min-width:0}
.c1{display:flex!important;align-items:center;gap:8px}
.c1 strong{font-size:17px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.c2{color:var(--muted);font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.c3{display:flex!important;flex-direction:column;font-size:14px;font-variant-numeric:tabular-nums}
.c3 b{display:inline-block;width:78px;font-weight:600;color:var(--muted)}
.c4{font-size:14px}
.cval{display:flex!important;align-items:baseline;justify-content:space-between;border-top:1px dashed var(--line);padding-top:8px;margin-top:2px;font-weight:700;font-variant-numeric:tabular-nums}
.falta{color:var(--bad);font-weight:600}
.pin{color:var(--info);font-weight:700}

.pill{font-size:12px;font-weight:700;border-radius:20px;padding:2px 9px;white-space:nowrap;text-transform:uppercase;letter-spacing:.04em}
.st-agendada{background:var(--info-soft);color:var(--info)}
.st-obra{background:var(--accent-soft);color:var(--ink)}
.st-atrasada{background:var(--bad-soft);color:var(--bad)}
.st-devolvida{background:var(--surface2);color:var(--muted)}

.dot{width:12px;height:12px;border-radius:50%;flex:none;display:inline-block;background:var(--muted)}
.dot.pago{background:var(--ok)} .dot.aberto{background:var(--bad)} .dot.parcial{background:var(--warn)} .dot.semvalor{background:transparent;border:2px solid var(--muted)}
.dot.big{width:16px;height:16px}

.empty{background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);padding:28px 20px;text-align:center;color:var(--muted)}
.empty strong{display:block;color:var(--ink);font-size:18px;margin-bottom:4px}

/* agenda */
.agbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.agbar h2{flex:1;min-width:180px}
.agbar h2::first-letter{text-transform:uppercase}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:8px 14px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.mes{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--line);gap:1px}
.dow{background:var(--surface2);text-align:center;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:6px 0}
.cell{background:var(--surface);border:0;min-height:104px;padding:6px;text-align:left;display:flex;flex-direction:column;gap:3px;min-width:0;align-items:stretch}
.cell.fora{background:var(--surface2);color:var(--muted)}
.cell .num{font-weight:700;font-size:14px;font-variant-numeric:tabular-nums;align-self:flex-start;padding:1px 6px;border-radius:6px}
.cell.hoje .num{background:var(--accent);color:var(--accent-ink)}
.cell.sel{box-shadow:inset 0 0 0 2px var(--ink)}
.mchip{display:block;font-size:12px;line-height:1.25;padding:2px 5px;border-radius:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.mchip.saida{background:var(--accent-soft);color:var(--ink);border-left:3px solid var(--accent)}
.mchip.devolucao{background:var(--info-soft);color:var(--ink);border-left:3px solid var(--info)}
.mchip.feita{opacity:.55}
.mais{font-size:12px;color:var(--muted);padding-left:4px}
.minis{display:none;gap:3px;flex-wrap:wrap}
.mini{width:7px;height:7px;border-radius:50%;display:inline-block}
.mini.saida{background:var(--accent)} .mini.devolucao{background:var(--info)}
@media (max-width:640px){
  .cell{min-height:56px;padding:4px;align-items:center}
  .cell .num{align-self:center}
  .mchip,.mais{display:none}
  .minis{display:flex;justify-content:center}
}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:14px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.dia{display:flex;flex-direction:column;gap:6px}
.diahead{display:flex;align-items:baseline;gap:10px;padding:8px 2px 2px;border-bottom:1px solid var(--line)}
.diahead strong{font-family:var(--f-display);font-size:20px}
.diahead strong::first-letter{text-transform:uppercase}
.diahead.hoje strong{background:var(--accent-soft);padding:0 6px;border-radius:4px}
.ev{display:grid;grid-template-columns:56px 98px minmax(0,1fr);gap:10px;align-items:start;text-align:left;background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--accent);border-radius:8px;padding:10px 12px;width:100%}
.ev.devolucao{border-left-color:var(--info)}
.ev.feita{opacity:.6}
.ev:hover{border-color:var(--muted)}
.evh{font-weight:700;font-variant-numeric:tabular-nums}
.evt{font-weight:600;font-size:14px}
.evc{min-width:0;display:flex;flex-direction:column}
.evc .muted,.evi{font-size:14px}
.evi{color:var(--muted)}
@media (max-width:520px){.ev{grid-template-columns:48px minmax(0,1fr)}.evt{grid-column:2}.evc{grid-column:2}}
.nada{color:var(--muted);font-size:14px;padding:6px 2px}

/* estoque */
.cat{display:flex;flex-direction:column;gap:8px}
.itemrow{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.itemtop{display:flex;flex-direction:column;gap:10px;width:100%;border:0;background:none;text-align:left;padding:14px;color:var(--ink)}
.nmrow{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.nmrow strong{font-size:17px;line-height:1.25}
.itemtop > small{margin-top:-6px;font-size:14px}
.qrow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.qn{display:flex;flex-direction:column;gap:2px;background:var(--surface2);border-radius:8px;padding:8px 10px;font-variant-numeric:tabular-nums;min-width:0}
.qn b{font-family:var(--f-display);font-size:26px;line-height:1.05}
.qn small{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.qn.uso b{color:var(--warn)} .qn.disp b{color:var(--ok)} .qn.neg b{color:var(--bad)}
.chev{color:var(--muted);font-size:22px;line-height:1;transition:transform .15s}
.itemrow.open .chev{transform:rotate(90deg)}
.bar{height:5px;background:var(--surface2);margin:0 14px 14px;border-radius:4px;overflow:hidden;display:flex}
.bar i{display:block;height:100%;background:var(--accent)}
.itemdet{border-top:1px solid var(--line);padding:12px 14px;display:flex;flex-direction:column;gap:8px;background:var(--surface2)}
.quem{display:flex;justify-content:space-between;gap:10px;border:0;background:none;text-align:left;padding:4px 0;font-size:15px;width:100%}
.quem:hover strong{text-decoration:underline}
.stats.s3{grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:640px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.stats.s3{grid-template-columns:repeat(3,minmax(0,1fr))}.stat{padding:10px 12px}}

.tw{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;background:var(--surface2)}
td.r,th.r{text-align:right}
tr:last-child td{border-bottom:0}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--surface2)}
tfoot td{font-weight:700;background:var(--surface2)}

.fin3{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.fin3 .stat .v{font-size:34px}
.prog{height:12px;border-radius:6px;background:var(--bad-soft);overflow:hidden;display:flex}
.prog i{background:var(--ok);display:block}

.rows{display:flex;flex-direction:column;gap:8px}
.rowb{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;text-align:left;width:100%}
.rowb:hover{border-color:var(--muted)}
.rowb .grow{flex:1;min-width:0}
.rowb .grow strong{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rowb .grow small{color:var(--muted)}
.rowb .rt{text-align:right;font-variant-numeric:tabular-nums;font-size:14px}

/* janela */
.modal{position:fixed;inset:0;z-index:20;background:rgba(10,14,18,.5);display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;padding:max(24px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) max(24px,env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.sheet{background:var(--bg);border-radius:14px;width:100%;max-width:720px;box-shadow:0 20px 60px rgba(0,0,0,.35);position:relative}
.shhead{display:flex;align-items:flex-start;gap:10px;padding:18px 20px 14px;border-bottom:1px solid var(--line);background:var(--surface);border-radius:14px 14px 0 0;position:sticky;top:0;z-index:2}
.shhead h2{flex:1;min-width:0;font-size:24px}
.x{border:0;background:none;font-size:26px;line-height:1;padding:4px 8px;color:var(--muted);border-radius:6px}
.x:hover{background:var(--surface2);color:var(--ink)}
.shbody{padding:18px 20px 22px;display:flex;flex-direction:column;gap:16px}
@media (max-width:560px){
  .modal{padding:max(8px,env(safe-area-inset-top,0px)) 0 0;flex-direction:column;align-items:stretch;justify-content:flex-start}
  .sheet{border-radius:14px 14px 0 0;min-height:70vh;padding-bottom:env(safe-area-inset-bottom,0px);margin-top:auto;flex:none}
  .shbody{padding:16px max(16px,env(safe-area-inset-left,0px)) 24px max(16px,env(safe-area-inset-right,0px))}
  .shhead{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
}
.box{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.kv div{display:flex;flex-direction:column;gap:2px;min-width:0}
.kv div span:last-child{overflow-wrap:anywhere}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.finbig{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.finbig div{display:flex;flex-direction:column}
.finbig div{min-width:0}
.finbig b{font-family:var(--f-display);font-size:clamp(16px,5vw,26px);font-variant-numeric:tabular-nums;line-height:1.1;overflow-wrap:anywhere}
.finst{display:flex;align-items:center;gap:8px;font-weight:700}
.pg{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.pg:first-child{border-top:0}
.pg .grow{flex:1;min-width:140px}
.anx{display:flex;gap:8px;flex-wrap:wrap}
.thumb{width:64px;height:64px;border-radius:8px;border:1px solid var(--line);overflow:hidden;padding:0;background:var(--surface2);flex:none}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.file{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:14px;color:var(--ink);text-decoration:none;background:var(--surface);max-width:100%}
.file i{font-style:normal;font-size:11px;font-weight:700;background:var(--bad);color:#fff;border-radius:3px;padding:1px 4px}
.file span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.anxitem{display:flex;align-items:center;gap:4px;max-width:100%}
.mapa{width:100%;aspect-ratio:16/9;max-height:260px;border:0;border-radius:8px;background:var(--surface2);display:block}

form{display:flex;flex-direction:column;gap:14px}
.f{display:flex;flex-direction:column;gap:5px;min-width:0}
.f > span{font-size:14px;font-weight:600}
.f small,.hint{font-size:13px;color:var(--muted)}
input[type=text],input[type=number],input[type=tel],input[type=email],input[type=password],input[type=url],input[type=datetime-local],input[type=date],input:not([type]),select,textarea{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 12px;width:100%;min-width:0}
textarea{min-height:72px;resize:vertical}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.inrow{display:flex;gap:8px;align-items:stretch}
.inrow input{flex:1}
.linhas{display:flex;flex-direction:column;gap:8px}
.linha{display:grid;grid-template-columns:minmax(0,1fr) 96px auto 36px;gap:8px;align-items:center}
.lDisp{font-size:13px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.lDisp.over{color:var(--bad);font-weight:700}
@media (max-width:520px){.linha{grid-template-columns:minmax(0,1fr) 80px 32px}.lDisp{grid-column:1/-1;grid-row:2;margin-top:-4px}}
.err{color:var(--bad);font-weight:600;font-size:14px}
.formacts{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;padding-top:4px}
.addpg{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;align-items:end;background:var(--surface2);border-radius:8px;padding:12px}
.locok{font-size:13px;color:var(--ok);font-weight:600}
pre.sql{background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:12px;overflow-x:auto;font-size:12px;max-height:240px}
ol.passos{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}

#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:40;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-weight:600;max-width:calc(100% - 32px);box-shadow:0 6px 24px rgba(0,0,0,.25)}
#toast.bad{background:var(--bad);color:#fff}
#lightbox{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.88);display:flex;align-items:center;justify-content:center;padding:20px}
#lightbox img{max-width:100%;max-height:100%;border-radius:6px}
#lightbox button{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));right:calc(12px + env(safe-area-inset-right,0px));color:#fff;font-size:32px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="top">
  <div class="wrap topin">
    <picture>
      <source srcset="icones/logo-escuro.png" media="(prefers-color-scheme: dark)">
      <img class="logo" src="icones/logo-claro.png" alt="WJR – Locação de equipamentos para obras">
    </picture>
    <div class="topacts">
      <button class="btn dark small" data-a="instalar" id="btnInstalar" hidden>Instalar app</button>
      <button class="btn primary" data-a="novaLoc" id="btnNovaTopo">+ Nova locação</button>
    </div>
  </div>
</header>
<nav class="tabs" aria-label="Seções"><div class="wrap tabsin" id="tabs"></div></nav>
<div class="wrap" id="aviso"></div>
<main class="wrap" id="main"><div class="empty"><strong>Abrindo…</strong>Carregando os dados da WJR.</div></main>
<div id="modal" class="modal" hidden><div class="sheet" role="dialog" aria-modal="true" id="modalBody"></div></div>
<div id="toast" hidden></div>
<div id="lightbox" hidden><button class="x" data-a="fecharImg" aria-label="Fechar">×</button><img alt="Comprovante"></div>
<script src="app.js"></script>
</body>
</html>
